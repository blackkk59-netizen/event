<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Event Next Door</title>

    <link rel="stylesheet" href="css/content.css">

    <style>

        body{

            font-family: Arial, sans-serif;

            margin:0;

            padding:0;

        }

        .auth-container{

            width:400px;

            max-width:90%;

            margin:50px auto;

            background:white;

            padding:30px;

            border-radius:8px;

            box-shadow:0 0 10px rgba(0,0,0,.2);

        }

        h2{

            text-align:center;

            margin-bottom:25px;

        }

        .form-group{

            margin-bottom:15px;

        }

        label{

            display:block;

            margin-bottom:5px;

            font-weight:bold;

        }

        input{

            width:100%;

            padding:10px;

            box-sizing:border-box;

        }

        button{

            width:100%;

            padding:12px;

            background:#ff9800;

            color:white;

            border:none;

            cursor:pointer;

            font-size:16px;

        }

        button:hover{

            background:#e68900;

        }

        #formError{

            color:red;

            text-align:center;

            margin-bottom:15px;

            font-weight:bold;

        }

        .auth-link{

            margin-top:20px;

            text-align:center;

        }

        .auth-link a{

            text-decoration:none;

            color:#ff9800;

        }

    </style>

</head>

<body>
    <button class="nav-toggle" onclick="this.nextElementSibling.classList.toggle('open')" aria-label="Menu">
  <span></span><span></span><span></span>
</button>
<div class="nav-links">
  <!-- your nav links here -->
</div>

<nav style="background:#222;padding:15px;text-align:center;">

<a href="index.html" style="color:white;text-decoration:none;">

← Back To Home

</a>

</nav>

<div class="auth-container">

<h2>Create Account</h2>

<div id="formError"></div>

<form id="registerForm">

<div class="form-group">

<label for="firstName">

First Name

</label>

<input
type="text"
id="firstName"
name="firstName"
required>

</div>

<div class="form-group">

<label for="lastName">

Last Name

</label>

<input
type="text"
id="lastName"
name="lastName"
required>

</div>

<div class="form-group">

<label for="email">

Email

</label>

<input
type="email"
id="email"
name="email"
required>

</div>

<div class="form-group">

<label for="phone">

Phone Number

</label>

<input
type="tel"
id="phone"
name="phone"
required>

</div>

<div class="form-group">

<label for="password">

Password

</label>

<input
type="password"
id="password"
name="password"
required>

</div>

<div class="form-group">

<label for="passwordConfirm">

Confirm Password

</label>

<input
type="password"
id="passwordConfirm"
name="passwordConfirm"
required>

</div>

<button type="submit">

Register

</button>

</form>

<div class="auth-link">

Already have an account?

<a href="login.html">

Login Here

</a>

</div>

</div>

<script src="js/api.js"></script>

<script src="js/register.js"></script>

</body>

</html>
